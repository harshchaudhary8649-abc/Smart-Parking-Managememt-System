<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset SmartPark</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #142033;
      }
      div {
        width: min(460px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid #dce7f0;
        border-radius: 8px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>SmartPark Reset</h1>
      <p>Saved browser data cleared. Opening app...</p>
    </div>
    <script>
      localStorage.removeItem("smartpark_user");
      localStorage.removeItem("smartpark_token");
      setTimeout(function () {
        window.location.href = "/";
      }, 800);
    </script>
  </body>
</html>
